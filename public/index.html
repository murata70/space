<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>SPACE & OCEAN WALLPAPER - React App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /*
          アプリ全体の土台。初期値は宇宙の黒色に設定。
          海画面へ遷移した際は、App.jsx内のコントローラーによって
          完全に独立した青系の背景色へと動的に切り替わります。
        */
        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050816; /* 初期ホワイトアウト防止用（宇宙の黒） */
            transition: background-color 0.15s ease; /* 切り替えを滑らかに */
        }

        /* 壁紙プラットフォームとしての操作性向上（不要なテキスト選択などを防止） */
        body {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
